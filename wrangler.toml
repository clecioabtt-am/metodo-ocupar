name = "metodo-ocupar"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ocupar-db"
database_id = "710050f5-6425-4ff3-8668-752ba8ab609a"

[[r2_buckets]]
binding = "FILES"
bucket_name = "ocupar-filess"

[vars]
APP_NAME = "Método Ocupar"
